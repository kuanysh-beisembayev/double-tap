name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download AutoHotkey and Ahk2Exe
        shell: pwsh
        run: |
          curl.exe -sSLo ahk.zip https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.28/AutoHotkey_2.0.28.zip
          curl.exe -sSLo ahk2exe.zip https://github.com/AutoHotkey/Ahk2Exe/releases/download/Ahk2Exe1.1.37.02a2/Ahk2Exe1.1.37.02a2.zip
          Expand-Archive ahk.zip ahk
          Expand-Archive ahk2exe.zip ahk2exe

      - name: Compile
        shell: pwsh
        run: |
          & ahk2exe\Ahk2Exe.exe /in double-tap.ahk /out double-tap.exe /base ahk\AutoHotkey64.exe /silent verbose | Out-Host
          if (-not (Test-Path double-tap.exe)) { exit 1 }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: double-tap
          path: double-tap.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} double-tap.exe --generate-notes
